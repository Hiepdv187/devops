services:
  db-postgres:
    image: postgres:15
    container_name: fiber-learning-pg
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  app:
    build: .
    container_name: fiber-learning-app
    restart: unless-stopped
    ports:
      - "3003:3000"
    env_file:
      - .env
    volumes:
      - uploads_data:/app/public/uploads
    depends_on:
      - db-postgres

volumes:
  pg_data:
  uploads_data:
